openapi: 3.1.0
info:
  title: Foldbun Stack public API
  version: 1.0.0
  description: |
    Pay-per-use computer-vision model API (segmentation, OCR, document parsing, embeddings,
    background removal). v1: synchronous calls only; asynchronous jobs and webhooks come later.

    **Request id.** Every response (errors included) carries `X-Request-Id`, a random 16-hex-character id
    generated by the server (a header sent by the client is ignored). Quote it when contacting support.

    **Auth.** `Authorization: Bearer fbs_...` (API key created in the console). A key may carry
    `model:<id>` scopes; when it has any, it can only call those models.

    **Money.** Amounts are credits, written as JSON numbers with up to 6 decimals (the unit is a
    micro-credit, so they are exact). Top-ups are credited at US$1 = 1,000 credits. `cost` is what
    this call charged, `balance` is the account balance after it. Failed calls cost 0.

    **Images.** Every image input is `{"id": "img_<sha256>"}`, `{"base64": "..."}` or
    `{"url": "https://..."}` (`url` is reserved: **later**, today it answers 400 `unsupported`).
    Uploaded images are sanitized by Stack, and an inline `image.base64` behaves like an upload: metadata
    (EXIF, XMP, comments, thumbnails) and any data appended after the image are removed at upload; the pixels
    are not changed or re-encoded. The image itself is kept for at most 7 days (below). It is never forwarded to
    GPU nodes, which only receive per-model resized copies generated by Stack. **All coordinates in requests and
    responses are pixels of the oriented original**: the uploaded image with its EXIF orientation applied, at its
    full size. Its size is returned as `image.width` / `image.height` (and by `POST /v1/images`); there is no
    resizing and no short-side limit beyond the input limits below. Boxes and polygons are always in image pixels; a
    mask can be smaller than the image: it carries its own size in `mask.size`, and clients scale by it (see
    `options.maskSize`).
    `img_<sha256>` is the SHA-256 of the sanitized bytes (not of the uploaded file). A handle is valid only inside the account
    that uploaded it, and is kept on a best-effort basis and **deleted after at most 7 days**, counted from
    when the account first stored it (earlier under capacity pressure, least recently used first; no minimum
    retention): on `404 image_not_found`, upload again. If the image storage is temporarily unavailable, a call
    answers `503 unavailable` with `Retry-After`. A file that passes the upload checks but cannot be decoded
    is `400 invalid_image` on its first use; the handle then keeps answering `invalid_image`, and the call is never charged.
    Accepted: JPEG, PNG, static WebP; at most 20 MiB and 40 megapixels (16384 px per side) per
    upload, and a JPEG has at most 64 scans (progressive files from common encoders use about 10;
    more is `400 invalid_request`); a JSON request body is at most 28 MiB so a base64 image fits.

    **Caching and the SAM encoding fee.** SAM-family models (`sam3`, `sam-lite`) charge an image
    encoding fee (`encode_image`) per call. When the encoding of the same image was already computed
    for the calling account and is still cached on the GPU node, the fee is waived and the response says
    `"cache": "hit"` with `"imageFee": 0`. This is a bonus, **not a promise**: cached encodings are
    **deleted after at most 7 days** and evicted earlier under capacity pressure, with no minimum retention. Caches are per account and never shared across accounts.

    **Segmentation results.** Instances carry a simplified polygon with holes by default and no mask; masks (COCO
    compressed RLE or lossless WebP crops) are returned on request. Post-processing (score and size filters, cleanup,
    overlap removal, merging) is free and configured per prompt; see `SegmentRequest` and `SegmentOptions`.

    **CBOR responses.** `POST /v1/segment`, `POST /v1/refine`, `POST /v1/remove-background` and the JSON mode of
    `POST /v1/batch/{endpoint}` answer in CBOR (RFC 8949, `Content-Type: application/cbor`) when `Accept` lists
    `application/cbor`; any other `Accept` gives JSON. The structure and the keys are those of the JSON response.
    Polygon rings (`outer` and each entry of `holes`) are RFC 8746 typed arrays, tag 69 (uint16, little-endian, x and y
    interleaved, absolute image pixels); binary payloads (`data` of WebP masks and of background removal) are byte
    strings instead of base64; integers are CBOR integers and other numbers are floating point. Requests, errors and
    event streams are always JSON. A replayed response (`Idempotency-Key`) follows the `Accept` of the repeated request.

    **Errors.** `{"error": {"code", "message", "retryable", "retryAfterMs"}}`. `429` and `503` carry a
    `Retry-After` header (seconds). Codes are listed on the `Error` schema.

    **Idempotency.** Send `Idempotency-Key: <1..128 printable ASCII>` on any POST that spends credits.
    Within an account, a key is remembered for 24 hours. Repeating a request with the same body returns the
    original response (status and body, plus header `Idempotent-Replayed: true`) and does not charge or run
    again; the same key with a different body is `409 idempotency_conflict`; the same key while the first request is
    still running is `409 request_in_progress`. Only final outcomes are stored (2xx and permanent 4xx); a 402, 429 or 5xx
    frees the key so the same request can be retried under it. A malformed body (`400 invalid_request` from the
    structural check) and a model the calling API key may not use (`403 model_locked`) are answered before the
    Idempotency-Key is looked up: they are never stored and never replayed, so a key never receives a stored
    response for a model it is not allowed to call.

    **Pools and limits.** What a key may call and how fast depends on the account tier (see
    `GET /v1/models` for what applies to the calling account). Registered accounts use the public pool (a few models, 100 calls per UTC
    day, 10 per minute, `429 daily_limit_reached` beyond); funded accounts also get the free pool
    (1,000 calls per UTC day included at no charge) and every model is available against balance. The 60 per minute
    of the free pool only paces the included calls: a call beyond the daily allowance, or one arriving faster
    than 60 per minute, is billed from the balance at the normal price and has no per-minute limit (the account's
    concurrency limit still applies). A call that would be billed for lack of rate, but that the balance cannot cover,
    answers `429 rate_limited`. Out of balance is `402 insufficient_balance`.

    **Batch.** `POST /v1/batch/{endpoint}` runs up to 1,000 single-call bodies (`items`) of one endpoint
    (`segment`, `ocr`, `documents/parse`, `embeddings`, `remove-background`) under one model, one after another,
    in one request. Items are scheduled in the batch class (below interactive and sync traffic, fair between
    accounts). Each item is priced, billed and settled exactly like a single call, as soon as it finishes; the
    per-minute rate limit takes one token for the whole request. Images in items must be `{"id": "img_..."}`
    handles (upload first). **Server-Sent Events (`Accept: text/event-stream`) is the recommended mode**: results
    arrive item by item and progress heartbeats keep the connection alive (up to 600 s). Plain JSON mode waits for
    all items and is limited to 90 s; it is **not recommended** beyond a few items. `timeoutSec` can only shorten
    the limit. Items not finished at the limit are returned as `expired` and are not billed. With
    `Idempotency-Key`, a repeated batch replays the finished items. Not available on the Playground trial lane.

    **More.** Guides: [Quickstart](/docs/quickstart/), [Errors](/docs/errors/), [Rate limits and pools](/docs/rate-limits/),
    [Billing](/docs/billing/). The machine-readable contract is [openapi.yaml](/docs/openapi.yaml).
servers:
  - url: https://api.stack.foldbun.com
    description: Production.
security:
  - bearer: []
tags:
  - name: Images
    description: Upload an image once and reuse its handle in later calls. Free of charge.
  - name: Segmentation
    description: Instance masks from text, box and point prompts, and interactive refinement of a single mask. Models `sam3` and `sam-lite`.
  - name: OCR
    description: Text recognition for screenshots and crops (`ppocr-v6`), and layout analysis of document pages (`paddleocr-vl`).
  - name: Embeddings
    description: Image and text vectors for similarity search. Models `dinov3` and `siglip2`.
  - name: Background removal
    description: Cut-out of the main subject, or its alpha matte, from one image. Model `birefnet`.
  - name: Catalog
    description: Models, prices and what the calling account may use. Free and not metered.
  - name: Batch
    description: Many calls of one endpoint in one request, delivered as an event stream (recommended) or one JSON document. Billed per item at the single-call prices.
paths:
  /v1/images:
    post:
      tags: [Images]
      operationId: uploadImage
      summary: Upload an image, get a handle
      description: |
        Send the file either as `multipart/form-data` (field `file`) or as the raw request body with
        `Content-Type: image/jpeg | image/png | image/webp`. The image is sanitized (see the Overview); the handle is
        content-addressed, so uploading the same picture again returns the same `id` (HTTP 200 instead of 201).
        Free of charge. Not usable to probe other accounts' images: handles only resolve inside the owning account.
        Accepted formats and size limits are listed in the Overview.
      requestBody:
        required: true
        description: The image file, as a multipart form or as the raw request body.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary, description: 'The image file: JPEG, PNG or static WebP.' } }
          image/jpeg: { schema: { type: string, format: binary, description: Raw JPEG bytes. } }
          image/png: { schema: { type: string, format: binary, description: Raw PNG bytes. } }
          image/webp: { schema: { type: string, format: binary, description: Raw static WebP bytes. } }
      responses:
        '200':
          description: "The same image was stored before; its existing handle is returned."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageInfo' }
              example:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
                width: 1008
                height: 672
                bytes: 184233
                contentType: image/jpeg
        '201': { description: The image was sanitized and stored; the new handle is returned., content: { application/json: { schema: { $ref: '#/components/schemas/ImageInfo' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/segment:
    post:
      tags: [Segmentation]
      operationId: segment
      summary: Segment objects from prompts
      description: |
        `sam3` takes text prompts, exemplar boxes ("find more like this") and point prompts, alone or mixed in one request.
        Billing counts decodes: each text prompt is billed once (`prompt`); exemplar boxes add no charge (they are attached
        to every text prompt), and a request with exemplar boxes but no text prompt is billed as one prompt. Point prompts
        are billed per `point`, and the image encoding once (`encode_image`, waived on a cache hit). A point prompt selects exactly one object (the best mask for that
        single positive point) and always yields one instance. Exemplar boxes apply to the text prompts, never to
        points. A request with point prompts only is valid. `sam-lite` takes only boxes and points; each
        prompt gives one instance and is billed per `box` or `point`, plus its own `encode_image`. Prices: `GET /v1/models`.
        Post-processing is free and configured per prompt (`options.defaults`, `prompts[].options`): prompt kinds and
        merging on `SegmentRequest`, processing order and limits on `SegmentOptions`. By default each instance carries a
        simplified polygon with holes and no mask.
        The call reserves the full price (encode fee + prompts) before it runs and settles on what the
        worker reports.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CborAccept' }
      requestBody:
        required: true
        description: Model, image and prompts of the segmentation.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SegmentRequest' }
            example:
              model: sam3
              image:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
              prompts:
                - text: dog
              options:
                defaults:
                  filter:
                    minScore: 0.5
      responses:
        '200':
          description: "The instances found, with the cost and balance of the call. CBOR with `Accept: application/cbor`."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SegmentResponse' }
              example:
                id: call_0b6c2f0e-6f0e-4d0e-9f3a-5c1d2e3f4a5b
                model: sam3
                image:
                  id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
                  width: 1008
                  height: 672
                  bytes: 184233
                  contentType: image/jpeg
                cost: 0.05
                balance: 96.25
                timing:
                  queueMs: 4
                  processingMs: 212
                  inferenceMs: 187
                  imageFetchMs: 0
                  serverMs: 231
                billing:
                  lines:
                    - unit: encode_image
                      quantity: 1
                      unitPrice: 0.5
                      amount: 0
                      waived: true
                    - unit: prompt
                      quantity: 1
                      unitPrice: 0.05
                      amount: 0.05
                      waived: false
                  total: 0.05
                  charged: true
                  pool: null
                instances:
                  - prompt: 0
                    label: dog
                    score: 0.97
                    bbox: [312, 148, 702, 611]
                    area: 121530
                    polygon:
                      - outer: [402, 148, 655, 170, 701, 402, 610, 610, 330, 590, 312, 300]
                dropStats:
                  - { prompt: 0, lowScore: 0, tooSmall: 0, tooSmallArea: 0, overlap: 1, limit: 0, budget: 0 }
                cache: hit
                imageFee: 0
            application/cbor:
              schema: { $ref: '#/components/schemas/SegmentResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v1/refine:
    post:
      tags: [Segmentation]
      operationId: refine
      summary: Refine one mask from clicks and/or a box
      description: |
        Interactive refinement of a single object: positive and negative `points`, optionally a `box`. Limits: at most 20
        points. Billed per call as one decode (`refine`, 1 per call), however many points and whether or not a box is
        given, plus the image encoding (`encode_image`, waived on a cache hit; refining an image that was just
        segmented is normally a hit). A client that re-sends all points after every click therefore pays the same for each click.
        Interactive priority: if the call has not finished within 2 s of submission, it fails with HTTP 504 and error code `upstream_timeout` (retryable).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CborAccept' }
      requestBody:
        required: true
        description: Image, clicks and/or box to refine one mask.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefineRequest' }
            example:
              model: sam3
              image:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
              points:
                - x: 412
                  y: 230
                  positive: true
                - x: 80
                  y: 40
                  positive: false
      responses:
        '200':
          description: 'The refined object (up to 3 candidates with `options.multimask`), in the same shape as a segmentation result without `dropStats`. CBOR with `Accept: application/cbor`.'
          content:
            application/json: { schema: { $ref: '#/components/schemas/SegmentResponse' } }
            application/cbor: { schema: { $ref: '#/components/schemas/SegmentResponse' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/ocr:
    post:
      tags: [OCR]
      operationId: ocr
      summary: Text recognition for screenshots and cropped regions
      description: Model `ppocr-v6` (default). Billed per image.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        description: Image to read.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OcrRequest' }
            example:
              image:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
              options:
                minConfidence: 0.5
                words: false
      responses:
        '200':
          description: "The recognised text lines."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrResponse' }
              example:
                id: call_0b6c2f0e-6f0e-4d0e-9f3a-5c1d2e3f4a5b
                model: ppocr-v6
                image:
                  id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
                  width: 1008
                  height: 672
                  bytes: 184233
                  contentType: image/jpeg
                cost: 0.25
                balance: 96.25
                timing:
                  queueMs: 4
                  processingMs: 212
                  inferenceMs: 187
                  imageFetchMs: 0
                  serverMs: 231
                billing:
                  lines:
                    - unit: image
                      quantity: 1
                      unitPrice: 0.25
                      amount: 0.25
                      waived: false
                  total: 0.25
                  charged: true
                  pool: null
                lines:
                  - text: "Total: 12.50"
                    confidence: 0.98
                    bbox:
                      - 40
                      - 32
                      - 220
                      - 58
                    quad:
                      - - 40
                        - 32
                      - - 220
                        - 32
                      - - 220
                        - 58
                      - - 40
                        - 58
        default: { $ref: '#/components/responses/Error' }
  /v1/documents/parse:
    post:
      tags: [OCR]
      operationId: parseDocument
      summary: Layout analysis and recognition of one document page
      description: |
        Model `paddleocr-vl` (default). One request is one page image (billed per `page`). Multi-page PDFs are **later**.
        Layout blocks (text, title, table, formula, figure, ...) are returned in reading order together with the
        page as Markdown (tables as HTML tables, formulas as LaTeX).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        description: One document page image.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParseRequest' }
            example:
              image:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
              options:
                blocks: true
      responses:
        '200': { description: 'The page as Markdown and, unless disabled, its layout blocks in reading order.', content: { application/json: { schema: { $ref: '#/components/schemas/ParseResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/embeddings:
    post:
      tags: [Embeddings]
      operationId: embed
      summary: Image or text embeddings
      description: |
        `dinov3` accepts one `image` (image-to-image similarity). `siglip2` accepts one `image` or 1 to 64 `texts`
        (image and text share one vector space). Give exactly one of `image` and `texts`. Billed per image (`image`)
        or per text (`text`). Vectors are L2-normalised float32 values.
        Licence note: `dinov3` output is covered by the DINOv3 License; products built on it should show "Built with DINOv3".
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        description: The model and exactly one of `image` and `texts`.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbedRequest' }
            example:
              model: siglip2
              texts:
                - a photo of a dog
                - a photo of a cat
      responses:
        '200': { description: 'One embedding per input image or text, in input order.', content: { application/json: { schema: { $ref: '#/components/schemas/EmbedResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/remove-background:
    post:
      tags: [Background removal]
      operationId: removeBackground
      summary: Background removal with a hair-level alpha matte
      description: Model `birefnet` (default). Billed per image.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CborAccept' }
      requestBody:
        required: true
        description: Image and output options.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveBackgroundRequest' }
            example:
              image:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
              options:
                output: cutout
                format: webp
      responses:
        '200':
          description: 'The cut-out or matte as a base64 image; a byte string with `Accept: application/cbor`.'
          content:
            application/json: { schema: { $ref: '#/components/schemas/RemoveBackgroundResponse' } }
            application/cbor: { schema: { $ref: '#/components/schemas/RemoveBackgroundResponse' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/batch/segment:
    post:
      tags: [Batch, Segmentation]
      operationId: batchSegment
      summary: Segmentation of many images
      description: |
        Model `sam3` or `sam-lite`. Items are `POST /v1/segment` bodies without `model` (`SegmentItem`), with the same options, post-processing and limits per item. Semantics, modes, limits and the event format are described on the `BatchRequest`, `BatchItem`
        and `BatchSummary` schemas and in the Overview. Server-Sent Events are recommended; JSON mode is not.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/BatchAccept' }
      requestBody:
        required: true
        description: The model, the items and an optional time limit.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SegmentBatchRequest' }
            example: {"model": "sam3", "items": [{"image": {"id": "img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000"}, "prompts": [{"text": "cat"}]}]}
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/batch/ocr:
    post:
      tags: [Batch, OCR]
      operationId: batchOcr
      summary: Text recognition of many images
      description: |
        Model `ppocr-v6` (default). Items are `POST /v1/ocr` bodies without `model`. Semantics, modes, limits and the event format are described on the `BatchRequest`, `BatchItem`
        and `BatchSummary` schemas and in the Overview. Server-Sent Events are recommended; JSON mode is not.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/BatchAccept' }
      requestBody:
        required: true
        description: The model, the items and an optional time limit.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
            example: {"model": "ppocr-v6", "items": [{"image": {"id": "img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000"}}]}
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/batch/documents/parse:
    post:
      tags: [Batch, OCR]
      operationId: batchParse
      summary: Layout analysis of many document pages
      description: |
        Model `paddleocr-vl` (default). Items are `POST /v1/documents/parse` bodies without `model`. Semantics, modes, limits and the event format are described on the `BatchRequest`, `BatchItem`
        and `BatchSummary` schemas and in the Overview. Server-Sent Events are recommended; JSON mode is not.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/BatchAccept' }
      requestBody:
        required: true
        description: The model, the items and an optional time limit.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
            example: {"model": "paddleocr-vl", "items": [{"image": {"id": "img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000"}}]}
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/batch/embeddings:
    post:
      tags: [Batch, Embeddings]
      operationId: batchEmbed
      summary: Embeddings of many images or texts
      description: |
        Model `dinov3` or `siglip2`. Items are `POST /v1/embeddings` bodies without `model`. Semantics, modes, limits and the event format are described on the `BatchRequest`, `BatchItem`
        and `BatchSummary` schemas and in the Overview. Server-Sent Events are recommended; JSON mode is not.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/BatchAccept' }
      requestBody:
        required: true
        description: The model, the items and an optional time limit.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
            example: {"model": "dinov3", "items": [{"image": {"id": "img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000"}}, {"image": {"id": "img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000"}}]}
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/batch/remove-background:
    post:
      tags: [Batch, Background removal]
      operationId: batchRemoveBackground
      summary: Background removal of many images
      description: |
        Model `birefnet` (default). Items are `POST /v1/remove-background` bodies without `model`. Semantics, modes, limits and the event format are described on the `BatchRequest`, `BatchItem`
        and `BatchSummary` schemas and in the Overview. Server-Sent Events are recommended; JSON mode is not.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/BatchAccept' }
      requestBody:
        required: true
        description: The model, the items and an optional time limit.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchRequest' }
            example: {"model": "birefnet", "items": [{"image": {"id": "img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000"}, "options": {"output": "cutout"}}]}
      responses:
        '200': { $ref: '#/components/responses/BatchResult' }
        default: { $ref: '#/components/responses/Error' }
  /v1/models:
    get:
      tags: [Catalog]
      operationId: listModels
      summary: Models, prices and what the calling account may use
      description: Free, not metered, not rate limited by pool. `available` and `pool` describe the calling account.
      responses:
        '200':
          description: All models with their prices and their availability for the calling account.
          content:
            application/json:
              example:
                data:
                  - id: sam3
                    name: SAM 3
                    task: segment
                    endpoints:
                      - /v1/segment
                      - /v1/refine
                    license: SAM License
                    prices:
                      - unit: encode_image
                        price: 0.5
                      - unit: prompt
                        price: 0.05
                      - unit: point
                        price: 0.02
                      - unit: refine
                        price: 0.02
                    available: true
                    pool: paid
                    freeDailyCalls: null
                    perMinute: null
                    unlockedBy: null
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Model' }, description: One entry per model. }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        API key created in the console, sent as `Authorization: Bearer fbs_...`. A key is `fbs_` followed by 43 base62
        characters and a 6-character checksum. A key may carry `model:<id>` scopes; when it has any, it can only call
        those models (`403 model_locked` otherwise). A missing, malformed, expired or revoked key is `401 unauthorized`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        1 to 128 printable ASCII characters. Within an account, a key is remembered for 24 hours: repeating the request
        with the same body returns the original response (header `Idempotent-Replayed: true`) without charging or
        running the call again. The same key with a different body is `409 idempotency_conflict`. See the Overview.
      schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[\x21-\x7e]+$' }
    BatchAccept:
      name: Accept
      in: header
      required: false
      description: '`text/event-stream` selects the recommended event-stream mode, even when `application/cbor` is also listed; `application/cbor` selects JSON mode encoded as CBOR (see the Overview); anything else selects JSON mode.'
      schema: { type: string, examples: [text/event-stream, application/cbor] }
    CborAccept:
      name: Accept
      in: header
      required: false
      description: '`application/cbor` returns the success response in CBOR (see the Overview); anything else returns JSON. Errors are always JSON.'
      schema: { type: string, examples: [application/cbor] }
  responses:
    Error:
      description: |
        The error envelope. The HTTP status follows the `code`; only `retryable: true` errors are worth repeating
        unchanged. A failed call costs 0.

        | Status | Codes |
        |---|---|
        | 400 | `invalid_request`, `invalid_image` (the image passed the upload checks but could not be decoded), `unsupported` |
        | 401 | `unauthorized` |
        | 402 | `insufficient_balance` |
        | 403 | `model_locked` |
        | 404 | `not_found`, `image_not_found` |
        | 409 | `idempotency_conflict`, `request_in_progress` |
        | 413 | `payload_too_large` |
        | 429 | `rate_limited`, `daily_limit_reached`, `too_many_batches` (all with `Retry-After`) |
        | 500 | `internal_error` |
        | 502 | `upstream_error`, `bad_model_output` |
        | 503 | `model_unavailable`, `model_busy`, `unavailable` (all with `Retry-After`) |
        | 504 | `upstream_timeout` |

        `model_unavailable` also covers a short loss of contact with the only GPU worker serving the model: for about a
        minute after the loss, interactive calls answer it at once with a short `Retry-After` (5 s), while sync and
        batch calls stay queued until their own deadline instead of failing.

        Meaning and retry guidance for each code: [Errors](/docs/errors/).
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: "Whole seconds to wait before retrying; present on 429 and 503." }
        X-Request-Id: { schema: { type: string, pattern: '^[0-9a-f]{16}$' }, description: "Server-generated request id (16 hexadecimal characters); present on every response. Quote it when contacting support." }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: model_busy
              message: model sam3 is busy; retry shortly
              retryable: true
              retryAfterMs: 5000
    BatchResult:
      description: |
        The batch ran (items may still have failed individually: the request itself only fails before execution,
        with the normal error envelope). With `Accept: text/event-stream` the body is a stream of events, flushed
        one by one: `progress` first, then `item` per finished item, `summary` last. Otherwise it is one JSON
        document, or one CBOR document with `Accept: application/cbor`.
      headers:
        X-Request-Id: { schema: { type: string, pattern: '^[0-9a-f]{16}$' }, description: "Server-generated request id (16 hexadecimal characters); present on every response. Quote it when contacting support." }
      content:
        text/event-stream:
          schema: { type: string, description: 'Events in the form `event: <name>` / `data: <one-line JSON>`, separated by a blank line. Names: `progress` (`BatchProgress`), `item` (`BatchItem`), `summary` (`BatchSummary`, last).' }
          example: |
            event: progress
            data: {"done":0,"remaining":2}

            event: item
            data: {"index":0,"status":"ok","result":{"id":"call_0193...","model":"dinov3","cost":0.05,"balance":9.95}}

            event: progress
            data: {"done":1,"remaining":1,"etaWaitMs":850}

            event: item
            data: {"index":1,"status":"error","error":{"code":"insufficient_balance","message":"insufficient balance: this call can cost up to 0.05 credits"}}

            event: summary
            data: {"counts":{"ok":1,"error":1,"expired":0},"cost":0.05,"balance":0.01,"elapsedMs":2310}
        application/json:
          schema: { $ref: '#/components/schemas/BatchResponse' }
        application/cbor:
          schema: { $ref: '#/components/schemas/BatchResponse' }
  schemas:
    Error:
      type: object
      description: Body of every error response.
      required: [error]
      properties:
        error:
          type: object
          description: The error.
          required: [code, message, retryable, retryAfterMs]
          properties:
            code: { type: string, description: 'Stable machine-readable error code. Branch on this, not on `message`. Listed with the HTTP statuses under Responses.' }
            message: { type: string, description: Human-readable explanation. The wording can change. }
            retryable: { type: boolean, description: 'True when repeating the same request unchanged can succeed.' }
            retryAfterMs: { type: integer, minimum: 0, description: Suggested wait before a retry in milliseconds; 0 when there is no hint. }
    Credits:
      type: number
      description: Amount in credits, up to 6 decimals.
      minimum: 0
    ImageRef:
      type: object
      description: 'An image input: give exactly one of `id`, `base64` and `url` (`url` is reserved).'
      minProperties: 1
      maxProperties: 1
      properties:
        id: { type: string, pattern: '^img_[0-9a-f]{64}$', description: 'Handle returned by `POST /v1/images` (or by an earlier call): `img_` plus the SHA-256 of the sanitized image. Valid only inside the uploading account.' }
        url: { type: string, format: uri, pattern: '^https://', description: 'Reserved (later). Currently 400 `unsupported`.' }
        base64: { type: string, description: 'Standard base64 of a JPEG, PNG or WebP file; a `data:` prefix is tolerated.' }
      additionalProperties: false
    ImageInfo:
      type: object
      description: The stored image (sanitized, not resized). Coordinates in requests and responses are pixels of the oriented original.
      required: [id, width, height, bytes, contentType]
      properties:
        id: { type: string, pattern: '^img_[0-9a-f]{64}$', description: 'Image handle: `img_` plus the SHA-256 of the sanitized bytes.' }
        width: { type: integer, description: Width of the oriented original in pixels (EXIF orientation applied). }
        height: { type: integer, description: Height of the oriented original in pixels (EXIF orientation applied). }
        bytes: { type: integer, description: Size of the stored image in bytes. }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp], description: Media type of the stored image (the type of the upload). }
    CallMeta:
      type: object
      description: Fields present in every successful response of an inference endpoint.
      required: [id, model, image, cost, balance, timing]
      properties:
        id: { type: string, description: 'Call id `call_<uuid>`; quote it to support.' }
        model: { type: string, description: Id of the model that served the call. }
        image:
          description: The oriented original the coordinates refer to. Absent for text-only embeddings.
          allOf: [ { $ref: '#/components/schemas/ImageInfo' } ]
        cost:
          $ref: '#/components/schemas/Credits'
          description: Credits this call charged. 0 for failed calls and calls covered by an included daily allowance. Internal accounts are metered but not debited, so `cost` is then the price of the call.
        balance:
          $ref: '#/components/schemas/Credits'
          description: Account balance in credits after the call (unchanged for internal accounts).
        timing:
          type: object
          description: >
            Server-side timing of this call in milliseconds. `queueMs` is the time from submission until a GPU node
            took the job (queueing, including a re-queue after a node failure); `processingMs` is from there until
            the result was back (image fetch, inference, and the node-to-server round trips). `inferenceMs`,
            `imageFetchMs` and `serverMs` break this down further. Network time between the client and the API is not included.
          required: [queueMs, processingMs]
          properties:
            queueMs: { type: integer, minimum: 0, description: Milliseconds from submission until a GPU node took the job. }
            processingMs: { type: integer, minimum: 0, description: Milliseconds from there until the result was back. }
            inferenceMs:
              type: integer
              minimum: 0
              description: >
                Model time on the GPU node as the node measured it, without the image fetch. Never larger than
                `processingMs`. Absent when the node did not report it.
            imageFetchMs:
              type: integer
              minimum: 0
              description: >
                Time the node spent obtaining the image bytes. 0 when the image was sent with the job or the node
                did not need it (encode cache hit). Absent when the node did not report it.
            serverMs:
              type: integer
              minimum: 0
              description: >
                Whole time inside the API server: request received, until just before the response is written.
                Includes reading the request body, image preparation, admission, `queueMs`, `processingMs` and
                billing settlement. Absent only in an idempotent replay of a response stored by an older server.
        billing:
          $ref: '#/components/schemas/CallBilling'
          description: How the call was priced.
    CallBilling:
      type: object
      description: >
        How this call was priced. Always agrees with the top-level `cost`: `cost` equals `total` when `charged`
        is true and 0 when it is false; internal accounts are metered and never debited, so there `cost` equals
        `total` and `charged` is false. (When the balance could not cover the whole price, `capped` is true and
        `total` is what was actually debited.) Absent only in an idempotent replay of a response stored by an
        older server.
      required: [lines, total, charged, pool]
      properties:
        lines:
          type: array
          description: One line per priced unit of the call.
          items:
            type: object
            required: [unit, quantity, unitPrice, amount, waived]
            properties:
              unit: { type: string, description: 'Price-book unit, as in `GET /v1/models` `prices[].unit` (for example `encode_image`, `prompt`, `refine`, `image`).' }
              quantity: { type: integer, minimum: 1, description: Units used. }
              unitPrice:
                $ref: '#/components/schemas/Credits'
                description: List price of one unit.
              amount:
                $ref: '#/components/schemas/Credits'
                description: >
                  Price of the line: `unitPrice * quantity`, or 0 when `waived`. On a call that is not `charged`
                  (trial, included daily allowance) lines still show the list price.
              waived:
                type: boolean
                description: >
                  True for the image-encoding fee when the node already held the encoding (`cache: hit`); `amount`
                  is then 0 and the fee that would have applied is `unitPrice * quantity`.
        total:
          $ref: '#/components/schemas/Credits'
          description: Price of the call (sum of the line amounts, cut down to the balance when `capped`).
        charged:
          type: boolean
          description: >
            Whether the account balance was debited. False for Playground trial calls and for calls covered by an
            included daily allowance (then `pool` and `allowance` are set); true for billed calls. Internal accounts are
            metered at the list price and never debited, so `charged` is false and `total` is the price.
        pool:
          type: [string, 'null']
          description: >
            The pool whose included daily allowance covered the call (`public` or `free`). Null for billed calls
            (including calls beyond the allowance), trial calls and internal accounts.
        allowance:
          type: object
          description: Today's (UTC) included calls of `pool`, counting this one. Present only when `pool` is set.
          required: [used, limit]
          properties:
            used: { type: integer, minimum: 1, description: 'Calls used today (UTC), including this one.' }
            limit: { type: integer, minimum: 1, description: Included calls per UTC day. }
        capped:
          type: boolean
          description: Present and true only when the price exceeded the balance and the debit was cut down to it.
    Bbox:
      type: array
      description: '[x1, y1, x2, y2] in pixels of the oriented original, x1 < x2, y1 < y2. Coordinates must be non-negative and lie inside the image (`image.width` x `image.height`).'
      items: { type: number }
      minItems: 4
      maxItems: 4
    Point:
      type: object
      description: A click on the image. Coordinates must be non-negative and lie inside the image (`image.width` x `image.height`).
      required: [x, y]
      properties:
        x: { type: number, description: Horizontal position in pixels of the oriented original. }
        y: { type: number, description: Vertical position in pixels of the oriented original. }
        positive: { type: boolean, default: true, description: 'True: the point lies on the object. False: the point lies on something to exclude.' }
    SizeThreshold:
      type: [object, 'null']
      description: |
        Minimum object size, judged on the tight box (`bbox`) of the cleaned instance. Exactly one of `ratio` and `px`;
        both or neither is `400 invalid_request`. The threshold is `s = ratio x min(image.width, image.height)` or
        `s = px`, and a box side shorter than `s` is too small (a side equal to `s` passes). 0 or `null` turns the check off.

        A box touches a border when its edge lies within `edgeTolerancePx` of it: horizontally when
        `x1 <= edgeTolerancePx` or `x2 >= image.width - edgeTolerancePx`, vertically when `y1 <= edgeTolerancePx` or
        `y2 >= image.height - edgeTolerancePx`. An object cut off by a border can look smaller than it is; `border`
        chooses how such a box is judged (`w`, `h`: width and height of the box; the condition shown makes it too small):

        | `border` | No touch | Horizontal only | Vertical only | Both |
        |---|---|---|---|---|
        | `strict` (default) | `min(w, h) < s` | `min(w, h) < s` | `min(w, h) < s` | `min(w, h) < s` |
        | `directional` | `min(w, h) < s` | `h < s` | `w < s` | never |
        | `cornerLongSide` | `min(w, h) < s` | `h < s` | `w < s` | `max(w, h) < s` |
        | `cornerShortSide` | `min(w, h) < s` | `h < s` | `w < s` | `min(w, h) < s` |
      additionalProperties: false
      properties:
        ratio: { type: number, minimum: 0, maximum: 1, description: Threshold as a fraction of the short side of the image. }
        px: { type: number, minimum: 0, maximum: 16384, description: Threshold in image pixels. }
        border: { type: string, enum: [strict, directional, cornerLongSide, cornerShortSide], default: strict, description: How a box that touches an image border is judged (see the table). }
        edgeTolerancePx: { type: integer, minimum: 0, maximum: 16, default: 1, description: Distance in image pixels within which a box edge counts as touching the image border. }
    AreaThreshold:
      type: [object, 'null']
      description: 'An area threshold: exactly one of `ratio` and `px`; both or neither is `400 invalid_request`. An area smaller than the threshold meets it (an equal area does not). 0 or `null` turns it off.'
      additionalProperties: false
      properties:
        ratio: { type: number, minimum: 0, maximum: 1, description: 'Threshold as a fraction of the image area (`image.width x image.height`).' }
        px: { type: number, minimum: 0, maximum: 268435456, description: Threshold in square image pixels. }
    PolygonOptions:
      type: object
      description: |
        Polygon output. Outlines are traced on the cleaned mask at image resolution (above 4096 px on the long side, on a
        grid of 4096 px and scaled) and simplified with the Douglas-Peucker algorithm. `tolerance` and `tolerancePx` are
        one setting: giving both in one object is `400 invalid_request`, and in layered options the more specific layer wins.
      additionalProperties: false
      properties:
        tolerance:
          type: number
          minimum: 0
          maximum: 0.02
          default: 0.001
          description: 'Simplification tolerance as a fraction of the image diagonal (`sqrt(image.width² + image.height²)`): the largest distance between a simplified edge and the traced outline. The default can change; set the value explicitly where it matters.'
        tolerancePx: { type: number, minimum: 0, maximum: 50, description: 'Simplification tolerance in image pixels, instead of `tolerance`. 0 keeps every outline vertex (subject to the vertex limit).' }
        holes: { type: boolean, default: true, description: 'Return the holes of each part. `false` returns outer rings only.' }
        maxParts: { type: integer, minimum: 1, maximum: 64, default: 64, description: 'Largest number of parts (separate pieces) per instance. The largest parts are kept.' }
    MaskOptions:
      type: object
      description: Mask output, used when `geometry` includes `mask`.
      additionalProperties: false
      properties:
        encoding:
          type: string
          enum: [coco, webp]
          default: coco
          description: |
            `coco`: COCO compressed RLE of the whole mask, lossless, readable with pycocotools. `webp`: lossless WebP of the
            tight crop around the object; smaller than `coco` only for very detailed outlines such as hair, slower to produce,
            and limited by the WebP pixel budget (see `SegmentOptions`).
    GeometryOutput:
      type: object
      description: 'Geometry of each instance. `bbox`, `score` and `area` are always returned; geometry that is not requested is not computed.'
      additionalProperties: false
      properties:
        geometry:
          type: array
          items: { type: string, enum: [polygon, mask] }
          uniqueItems: true
          maxItems: 2
          default: [polygon]
          description: '`polygon`: simplified outline with holes (`Instance.polygon`). `mask`: pixel mask (`Instance.mask`). `[]`: no geometry.'
        polygon: { $ref: '#/components/schemas/PolygonOptions' }
        mask: { $ref: '#/components/schemas/MaskOptions' }
    InstanceFilter:
      type: object
      description: 'Filters for search instances (`sam3` text prompts and exemplar boxes). On an object prompt they are `400 invalid_request`, and `options.defaults.filter` does not apply to object prompts.'
      additionalProperties: false
      properties:
        minScore: { type: number, minimum: 0, maximum: 1, default: 0.5, description: 'Lowest `score` kept (`dropStats.lowScore`).' }
        minSize:
          $ref: '#/components/schemas/SizeThreshold'
          description: 'Minimum box size (`dropStats.tooSmall`). Default: off.'
        minArea:
          $ref: '#/components/schemas/AreaThreshold'
          description: 'Minimum `area` of the cleaned instance (`dropStats.tooSmallArea`). Default: off.'
    Cleanup:
      type: object
      description: Mask cleanup, applied to every instance before the size filters and the geometry output. Areas are pixel areas of the mask.
      additionalProperties: false
      properties:
        dropFragments:
          $ref: '#/components/schemas/AreaThreshold'
          default: { ratio: 0.0001 }
          description: 'Parts (separate pieces) other than the largest one that are smaller than this are removed; the largest part is always kept. `null` keeps every part.'
        fillHoles:
          $ref: '#/components/schemas/AreaThreshold'
          default: { ratio: 0.0001 }
          description: 'Holes smaller than this are filled. `null` keeps every hole.'
    PromptOptions:
      type: object
      description: |
        Post-processing of the instances of one prompt, set for all prompts in `options.defaults` and for one prompt in
        `prompts[].options`. Each field takes the built-in default, overridden by `options.defaults`, overridden by the
        prompt's `options`. Objects (`polygon`, `mask`, `filter`, `cleanup`) merge field by field: setting
        `polygon.tolerance` keeps `polygon.holes`. Arrays (`geometry`) and threshold objects (`minSize`, `minArea`,
        `dropFragments`, `fillHoles`) are replaced as a whole; fields missing from a replaced threshold take their
        defaults, and `null` turns a threshold off.
      additionalProperties: false
      properties:
        geometry:
          type: array
          items: { type: string, enum: [polygon, mask] }
          uniqueItems: true
          maxItems: 2
          default: [polygon]
          description: '`polygon`: simplified outline with holes (`Instance.polygon`). `mask`: pixel mask (`Instance.mask`). `[]`: no geometry.'
        polygon: { $ref: '#/components/schemas/PolygonOptions' }
        mask: { $ref: '#/components/schemas/MaskOptions' }
        filter: { $ref: '#/components/schemas/InstanceFilter' }
        cleanup: { $ref: '#/components/schemas/Cleanup' }
        merge: { type: boolean, default: false, description: 'Combine the instances of this prompt with the other `merge: true` instances of the same `group` into one instance (see `SegmentRequest`).' }
    Nms:
      type: [object, 'null']
      description: |
        Overlap removal between search instances (non-maximum suppression). Greedy in score order: an instance is dropped
        (`dropStats.overlap`) when its IoU with an instance already kept in the same scope is greater than `iou`.
        Object-prompt instances never take part. Absent or `null`: off.
      additionalProperties: false
      properties:
        iou: { type: number, minimum: 0, maximum: 1, default: 0.7, description: 'IoU above which the lower-scoring instance is dropped (an equal IoU keeps both).' }
        metric: { type: string, enum: [mask, box], default: mask, description: '`mask`: IoU of the cleaned masks. `box`: IoU of `bbox`.' }
        scope: { type: string, enum: [group, all], default: group, description: '`group`: only instances of the same `group` are compared. `all`: all search instances are compared.' }
    Report:
      type: object
      description: Reporting of dropped instances.
      additionalProperties: false
      properties:
        droppedBoxes: { type: boolean, default: false, description: 'Return `dropped`: the box, score and reason of each dropped instance.' }
        lowScoreFloor: { type: [number, 'null'], minimum: 0, maximum: 1, default: null, description: 'Set: only candidates scoring at least this are counted in `dropStats.lowScore` and listed in `dropped`. `null`: candidates scoring at least 0.1 are counted in `dropStats.lowScore` and none are listed.' }
    SegmentOptions:
      type: object
      description: |
        Request-level options. Post-processing is free and runs in a fixed order; each step sees only what the previous
        steps kept, and the name in brackets is the `dropStats` counter of what a step drops:
        1. Score: search candidates below `filter.minScore` are dropped (`lowScore`). At most 300 candidates per request
           continue, in score order (`limit`).
        2. Cleanup (`cleanup`) of every instance.
        3. Size: `filter.minSize` (`tooSmall`), then `filter.minArea` (`tooSmallArea`), on the cleaned instance.
        4. Overlap: `nms` (`overlap`).
        5. Merge: `merge` within each `group`.
        6. Count: the first `maxInstances` search instances in score order are kept (`limit`). Object-prompt instances are always kept.
        7. Geometry output, then the response limits below.

        Score order, used by every step and for `instances`: descending `score`, then ascending `prompt`, then the order of
        the model's candidates.

        **Limits that depend on the image content.** They cannot be checked before the call runs, so they reduce the output
        by fixed rules instead of failing the call; the same request on the same image gives the same result, and each
        reduction is visible in the response:
        - **Vertex limit**, 8,192 vertices per instance (all rings). Above it, the polygon is simplified again with the
          tolerance doubled, at most 6 times, starting from the requested tolerance or 1 px, whichever is larger;
          `tolerancePx` then reports the tolerance applied. If it is still above the limit, the largest parts are kept as
          long as their total stays within the limit; if the largest part alone exceeds it, the instance has no `polygon`
          and `omitted: vertices`.
        - **Response budget**, 4 MiB of geometry per response, counting 4 bytes per polygon vertex, the length of each COCO
          `counts` string and the size of each WebP mask. Instances use the budget in score order; from the first one
          whose geometry does not fit, instances keep `bbox`, `score` and `area` but carry no geometry and
          `omitted: budget` (`budget`).
        - **WebP pixel budget**, 32 megapixels of WebP crops per response, in score order; from the first crop that does
          not fit, masks are returned as `coco` (`mask.encoding` says which).
        - `dropped` lists at most 300 instances, highest score first.

        Checked before the call runs (`400 invalid_request`, nothing is charged): the ranges of all options, at most 50
        prompts, and the combinations refused on `SegmentRequest`.
      additionalProperties: false
      properties:
        defaults: { $ref: '#/components/schemas/PromptOptions' }
        maxInstances: { type: integer, minimum: 1, maximum: 300, default: 100, description: 'Largest number of search instances returned, counted after filtering, overlap removal and merging. Object-prompt instances are not counted.' }
        maskSize: { type: integer, minimum: 64, maximum: 4096, default: 2048, description: "Long side of the mask grid in pixels (64 to 4096), used by `mask` output only. The grid is never larger than the image, so its long side is the smaller of this value and the image's long side; `mask.size` holds the actual size. Polygons and boxes are always in image pixels." }
        nms: { $ref: '#/components/schemas/Nms' }
        report: { $ref: '#/components/schemas/Report' }
    SegmentPrompt:
      type: object
      description: 'One prompt: exactly one of `text`, `box` and `point`, with optional `group` and `options`.'
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 200, description: 'Text prompt (`sam3`): the kind of object to find, 1 to 200 characters.' }
        box:
          $ref: '#/components/schemas/Bbox'
          description: 'Box prompt: an exemplar box (`sam3`) or the object box (`sam-lite`).'
        positive: { type: boolean, default: true, description: 'Exemplar boxes (`sam3`): true means "find more like this". `false` makes the box a negative exemplar ("not like this"): objects that look like it are left out. Accepted on `sam3` exemplar boxes only.' }
        point:
          $ref: '#/components/schemas/Point'
          description: 'Point prompt (`sam3`, `sam-lite`): one positive click on the object, in pixels of the oriented original. Negative points (`positive: false`) are not accepted here; use `POST /v1/refine`.'
        group: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,64}$', description: 'Group for overlap removal (`nms.scope: group`) and merging: 1 to 64 letters, digits and `_.:-`. Prompts with the same group are compared and merged with each other; a prompt without a group forms a group of its own. Returned on the instances.' }
        options: { $ref: '#/components/schemas/PromptOptions' }
    SegmentItem:
      type: object
      description: 'The body of `POST /v1/segment` without `model`: one item of `POST /v1/batch/segment`. Images only as `{"id": "img_..."}` in a batch.'
      required: [image, prompts]
      additionalProperties: false
      properties:
        image:
          $ref: '#/components/schemas/ImageRef'
          description: The image to segment.
        prompts:
          type: array
          minItems: 1
          maxItems: 50
          description: 'The prompts, at most 50 of any kind; rules on `SegmentRequest`.'
          items: { $ref: '#/components/schemas/SegmentPrompt' }
        options: { $ref: '#/components/schemas/SegmentOptions' }
    SegmentRequest:
      type: object
      description: |
        Segmentation request. A prompt is a search prompt, which finds any number of objects, or an object prompt, which
        returns exactly one:

        | Prompt | Kind | `filter` | `cleanup`, geometry | `nms` | `merge` | `maxInstances` |
        |---|---|---|---|---|---|---|
        | `sam3` text | search | yes | yes | yes | yes | counted |
        | `sam3` exemplar boxes without a text prompt (one search, `label` `_exemplar`) | search | yes | yes | yes | yes | counted |
        | `sam3` point, `sam-lite` box and point | object | `400` | yes | never | yes | not counted, always returned |

        Exemplar boxes used with text prompts act on every text prompt and take no `group` or `options`
        (`400 invalid_request`). Without a text prompt, the exemplar search uses the `group` and `options` of the first
        positive box, and the other boxes take none; `prompt` of its instances is the index of that box.

        **Merging.** Instances whose prompt has `merge: true` are combined per `group` into one instance: the union of
        their masks, with the highest `score`, the lowest `prompt` (whose `label` and output options apply), `bbox` and
        `area` of the union and `merged`, the number of instances combined. A group with one such instance returns it
        unchanged. A merged instance that contains an object-prompt instance is always returned; otherwise it counts
        toward `maxInstances`.
      required: [model, image, prompts]
      additionalProperties: false
      properties:
        model: { type: string, enum: [sam3, sam-lite], description: 'Model: `sam3` (text, exemplar boxes, points) or `sam-lite` (boxes, points).' }
        image:
          $ref: '#/components/schemas/ImageRef'
          description: The image to segment.
        prompts:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            `sam3`: `{"text": "..."}` (1 to 200 characters), `{"box": [...], "positive": true}` exemplar boxes
            (at most 10 boxes; a positive box means "find more like this"; box-only requests are allowed) and
            `{"point": {"x","y"}}` point prompts. A point prompt is one object: it yields exactly one instance (the best
            mask for that positive point) and is always returned. Exemplar boxes apply to the text prompts only, never to
            points. Point prompts may be mixed with the other kinds or used alone.
            `sam-lite`: `{"box": [...]}` or `{"point": {"x","y"}}`; one instance per prompt.
            At most 50 prompts of any kind per request.
            Each prompt has exactly one of `text`, `box` and `point`. A request needs at least one text prompt, positive exemplar box or point; a request whose boxes are all negative needs a text prompt (points do not count).
            Refused with `400 invalid_request`: `positive` on a prompt that has `point`, `positive: false` inside a point, and with `sam-lite` a `text` prompt or `positive` on a box.
          items: { $ref: '#/components/schemas/SegmentPrompt' }
        options: { $ref: '#/components/schemas/SegmentOptions' }
    RefineRequest:
      type: object
      description: 'Refinement request. At least one point or a `box` is required. Without a `box`, at least one point must be positive. The endpoint keeps no state between calls: send all points of the object with every call.'
      required: [image]
      additionalProperties: false
      properties:
        model: { type: string, enum: [sam3, sam-lite], default: sam3, description: Model used for the refinement. }
        image:
          $ref: '#/components/schemas/ImageRef'
          description: The image holding the object.
        points: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Point' }, description: Positive and negative clicks (at most 20). }
        box:
          $ref: '#/components/schemas/Bbox'
          description: Box around the object (optional).
        options:
          type: object
          description: 'Optional tuning of the result. The refined object is an object prompt: it is always returned, and candidates of `multimask` are never merged or compared for overlap. The vertex limit and the budgets of `SegmentOptions` apply.'
          additionalProperties: false
          properties:
            multimask: { type: boolean, default: false, description: Return up to 3 candidate masks instead of the best one. }
            maskSize: { type: integer, minimum: 64, maximum: 4096, default: 2048, description: "Long side of the mask grid in pixels (64 to 4096), used by `mask` output only. The grid is never larger than the image, so its long side is the smaller of this value and the image's long side; `mask.size` holds the actual size." }
            output: { $ref: '#/components/schemas/GeometryOutput' }
            cleanup: { $ref: '#/components/schemas/Cleanup' }
    PolygonPart:
      type: object
      description: |
        One part (separate piece) of a polygon. Rings are flat integer arrays `[x0, y0, x1, y1, ...]` in image pixels. Each
        vertex is the centre of an outline pixel, so `0 <= x <= image.width - 1` and `0 <= y <= image.height - 1`. A ring has
        at least 3 distinct vertices and is open (the first vertex is not repeated). Outer rings run clockwise on screen
        (positive shoelace area with y pointing down), holes counter-clockwise. A simplified ring can intersect itself.
      required: [outer]
      properties:
        outer: { type: array, minItems: 6, items: { type: integer, minimum: 0 }, description: The outer ring. }
        holes:
          type: array
          description: 'Holes, largest first. Absent when the part has none or `polygon.holes` is false.'
          items: { type: array, minItems: 6, items: { type: integer, minimum: 0 } }
    CocoMask:
      type: object
      description: 'The whole mask on the mask grid as COCO compressed RLE (column-major). `{"size", "counts"}` is a valid COCO RLE object for pycocotools.'
      required: [encoding, size, counts]
      properties:
        encoding: { type: string, const: coco, description: 'COCO compressed RLE.' }
        size: { type: array, items: { type: integer }, minItems: 2, maxItems: 2, description: '[height, width] of the mask grid: the image scaled to a long side of at most `options.maskSize`, never enlarged. Scale mask coordinates by `image.width / size[1]` horizontally and `image.height / size[0]` vertically.' }
        counts: { type: string, description: COCO compressed run-length string. }
    WebpMask:
      type: object
      description: 'The tight crop around the object on the mask grid, as a lossless WebP. Object pixels are white and the rest black; a channel value of 128 or more is object.'
      required: [encoding, size, offset, crop, data]
      properties:
        encoding: { type: string, const: webp, description: Lossless WebP crop. }
        size: { type: array, items: { type: integer }, minItems: 2, maxItems: 2, description: '[height, width] of the mask grid, as for `coco`.' }
        offset: { type: array, items: { type: integer }, minItems: 2, maxItems: 2, description: '[x, y] of the top-left corner of the crop on the mask grid.' }
        crop: { type: array, items: { type: integer }, minItems: 2, maxItems: 2, description: '[width, height] of the crop on the mask grid.' }
        data: { type: string, contentEncoding: base64, description: 'Base64 WebP; a byte string in CBOR responses.' }
    Instance:
      type: object
      description: One segmented object. All coordinates are image pixels unless noted.
      required: [score, bbox, area]
      properties:
        prompt: { type: integer, description: "Index into `prompts` that produced the instance (segment only); for a merged instance, the lowest index of its members." }
        group: { type: string, description: 'The `group` of the prompt, when the request set one.' }
        label: { type: string, description: "The text prompt (sam3 text prompts), `_exemplar` for exemplar boxes. Absent on instances of point prompts. Absent in `POST /v1/refine` responses." }
        score: { type: number, minimum: 0, maximum: 1, description: 'Confidence of the instance. For text-prompt and exemplar instances it is the detection confidence; for point, box (`sam-lite`) and refine instances it is the predicted IoU of the mask, the model''s own estimate of how well the mask fits the object. A merged instance has the highest score of its members.' }
        bbox:
          type: array
          items: { type: integer }
          minItems: 4
          maxItems: 4
          description: '[x1, y1, x2, y2]: tight box around the cleaned instance. x2 and y2 are exclusive, so x2 - x1 is the width in pixels.'
        area: { type: integer, minimum: 0, description: Pixel area of the cleaned instance. }
        merged: { type: integer, minimum: 2, description: 'Merged instances only: the number of instances combined.' }
        polygon:
          type: array
          description: 'When `geometry` includes `polygon`: the parts, largest first. Empty when no part forms a ring of 3 vertices (objects one or two pixels thin).'
          items: { $ref: '#/components/schemas/PolygonPart' }
        tolerancePx: { type: number, description: 'Present when the vertex limit (8,192 per instance) required a larger tolerance than requested: the tolerance actually applied, in image pixels.' }
        mask:
          description: 'When `geometry` includes `mask`. `encoding` says which form was returned: a `webp` request is answered with `coco` once the WebP pixel budget is used up.'
          oneOf:
            - $ref: '#/components/schemas/CocoMask'
            - $ref: '#/components/schemas/WebpMask'
        omitted: { type: string, enum: [budget, vertices], description: '`budget`: the response budget was used up, and the instance carries no geometry. `vertices`: the largest part alone exceeds the vertex limit, and the instance has no `polygon`. `bbox`, `score` and `area` are always kept.' }
    DropStats:
      type: object
      description: 'What one prompt lost, by reason. Every counter is present (0 when none).'
      required: [prompt, lowScore, tooSmall, tooSmallArea, overlap, limit, budget]
      properties:
        prompt: { type: integer, description: Index into `prompts`. }
        lowScore: { type: integer, minimum: 0, description: 'Candidates below `filter.minScore` that scored at least `report.lowScoreFloor` (0.1 when it is `null`); models emit many near-zero scores, which are not counted.' }
        tooSmall: { type: integer, minimum: 0, description: 'Dropped by `filter.minSize`.' }
        tooSmallArea: { type: integer, minimum: 0, description: 'Dropped by `filter.minArea`.' }
        overlap: { type: integer, minimum: 0, description: 'Dropped by `nms`.' }
        limit: { type: integer, minimum: 0, description: 'Beyond the 300 candidates per request or beyond `maxInstances`.' }
        budget: { type: integer, minimum: 0, description: 'Returned without geometry because the response budget was used up (`omitted: budget`); these are still in `instances`.' }
    Dropped:
      type: object
      description: One dropped instance (`report.droppedBoxes`).
      required: [prompt, reason, score, bbox]
      properties:
        prompt: { type: integer, description: Index into `prompts`. }
        reason: { type: string, enum: [lowScore, tooSmall, tooSmallArea, overlap, limit], description: 'The step that dropped it; same names as in `DropStats`.' }
        score: { type: number, minimum: 0, maximum: 1, description: Score of the instance. }
        bbox:
          type: array
          items: { type: integer }
          minItems: 4
          maxItems: 4
          description: '[x1, y1, x2, y2] as in `Instance.bbox`. For `lowScore`, `limit` and some `tooSmall` entries the instance was dropped before its mask was traced, and the box comes from the low-resolution mask of the model: approximate, and possibly larger than the object.'
    SegmentResponse:
      allOf:
        - $ref: '#/components/schemas/CallMeta'
        - type: object
          required: [instances, cache, imageFee]
          properties:
            instances: { type: array, items: { $ref: '#/components/schemas/Instance' }, description: 'Segmented objects in score order (see `SegmentOptions`).' }
            dropStats: { type: array, items: { $ref: '#/components/schemas/DropStats' }, description: '`POST /v1/segment` only: one entry per prompt that lost instances, in prompt order; empty when nothing was lost.' }
            dropped: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/Dropped' }, description: 'Only with `report.droppedBoxes`: dropped instances, highest score first, at most 300.' }
            cache:
              type: string
              enum: [hit, miss]
              description: '`hit`: the image encoding was reused and the encode fee waived. Not a promise; see the Overview.'
            imageFee:
              $ref: '#/components/schemas/Credits'
              description: Image encoding fee charged for this call; 0 on a cache hit.
    OcrRequest:
      type: object
      description: Text recognition request.
      required: [image]
      additionalProperties: false
      properties:
        model: { type: string, enum: [ppocr-v6], default: ppocr-v6, description: OCR model. }
        image:
          $ref: '#/components/schemas/ImageRef'
          description: The image to read.
        options:
          type: object
          description: Optional tuning of the result.
          additionalProperties: false
          properties:
            minConfidence: { type: number, minimum: 0, maximum: 1, default: 0.5, description: Lines below this confidence are dropped. }
            words: { type: boolean, default: true, description: Include word-level boxes. }
    Quad:
      type: array
      description: Four [x, y] corners, clockwise from top-left.
      items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 }
      minItems: 4
      maxItems: 4
    OcrResponse:
      allOf:
        - $ref: '#/components/schemas/CallMeta'
        - type: object
          required: [lines]
          properties:
            lines:
              type: array
              description: Recognised text lines, roughly from top to bottom and then left to right. There is no layout analysis, so the order is not a reading order.
              items:
                type: object
                required: [text, confidence, bbox, quad]
                properties:
                  text: { type: string, description: Recognised text of the line. }
                  confidence: { type: number, description: Recognition confidence from 0 to 1. }
                  bbox:
                    $ref: '#/components/schemas/Bbox'
                    description: Axis-aligned box around the line.
                  quad:
                    $ref: '#/components/schemas/Quad'
                    description: Corners of the line, for rotated or skewed text.
                  words:
                    type: array
                    description: Word-level results; present unless `options.words` is false. Whitespace can appear as a word of its own.
                    items:
                      type: object
                      required: [text, confidence, bbox]
                      properties:
                        text: { type: string, description: Recognised text of the word. }
                        confidence: { type: number, description: Recognition confidence from 0 to 1. }
                        bbox:
                          $ref: '#/components/schemas/Bbox'
                          description: Axis-aligned box around the word.
                        quad:
                          $ref: '#/components/schemas/Quad'
                          description: Corners of the word.
    ParseRequest:
      type: object
      description: Document parsing request.
      required: [image]
      additionalProperties: false
      properties:
        model: { type: string, enum: [paddleocr-vl], default: paddleocr-vl, description: Document parsing model. }
        image:
          $ref: '#/components/schemas/ImageRef'
          description: One page of the document as an image.
        options:
          type: object
          description: Optional tuning of the result.
          additionalProperties: false
          properties:
            blocks: { type: boolean, default: true, description: "Include `blocks` (otherwise only `markdown`)." }
    ParseResponse:
      allOf:
        - $ref: '#/components/schemas/CallMeta'
        - type: object
          required: [markdown, pages]
          properties:
            pages: { type: integer, const: 1, description: Number of pages parsed; always 1 for now. }
            markdown: { type: string, description: 'The page as Markdown (tables as HTML tables, formulas as LaTeX). The blocks joined in reading order.' }
            blocks:
              type: array
              description: Layout blocks in reading order.
              items:
                type: object
                required: [type, bbox, order]
                properties:
                  type: { type: string, enum: [text, title, table, formula, figure, caption, header, footer, list, other], description: Kind of layout block. }
                  order: { type: integer, description: "Reading order, from 0." }
                  bbox:
                    $ref: '#/components/schemas/Bbox'
                    description: Box of the block.
                  text: { type: string, description: 'Plain text of the block. Absent for blocks without text, such as a figure. A `table` block holds an HTML `<table>`; a `formula` block holds LaTeX delimited by `$$` (display formulas) or `$` (inline formulas, which layout analysis may also return as their own block, where the delimiter can be `$$` as well); formulas inside running text stay in the text of their block, delimited by `$`.' }
                  markdown: { type: string, description: Markdown of the block. Tables and formulas as in `text`. }
    EmbedRequest:
      type: object
      description: Embedding request. Give exactly one of `image` and `texts`.
      required: [model]
      additionalProperties: false
      properties:
        model: { type: string, enum: [dinov3, siglip2], description: 'Embedding model: `dinov3` (image only) or `siglip2` (image or text).' }
        image:
          $ref: '#/components/schemas/ImageRef'
          description: The image to embed.
        texts: { type: array, minItems: 1, maxItems: 64, items: { type: string, minLength: 1, maxLength: 1000 }, description: 'Texts to embed (1 to 64, each 1 to 1000 characters). `siglip2` only.' }
    EmbedResponse:
      allOf:
        - $ref: '#/components/schemas/CallMeta'
        - type: object
          required: [dimensions, embeddings]
          properties:
            dimensions: { type: integer, description: Length of each vector. }
            embeddings:
              type: array
              description: One embedding per input image or text, in input order.
              items:
                type: object
                required: [index, vector]
                properties:
                  index: { type: integer, description: Position of the input this vector belongs to. The position in `texts`, or 0 for an image. }
                  vector: { type: array, items: { type: number }, description: L2-normalised float32 values. }
    RemoveBackgroundRequest:
      type: object
      description: Background removal request.
      required: [image]
      additionalProperties: false
      properties:
        model: { type: string, enum: [birefnet], default: birefnet, description: Background removal model. }
        image:
          $ref: '#/components/schemas/ImageRef'
          description: The image to process.
        options:
          type: object
          description: Output options.
          additionalProperties: false
          properties:
            output: { type: string, enum: [cutout, matte], default: cutout, description: '`cutout`: RGBA image of the subject. `matte`: 8-bit grayscale alpha matte.' }
            format:
              type: string
              enum: [png, webp]
              default: png
              description: |
                Encoding of the returned image. `png`: lossless PNG. `webp`: for `cutout`, lossy RGB (quality 90) with a lossless alpha channel (the matte is exact); for `matte`, lossless WebP of the gray matte (stored as gray RGB, so every decoder shows it as gray, and the red channel is the matte). A WebP cutout is typically about 10 times smaller than the PNG (about 200 kB instead of 2 MB at 1791x1008) with no visible difference, so responses arrive faster.
            size: { type: integer, minimum: 64, maximum: 4096, default: 2048, description: 'Long side of the returned image, in pixels. The default is 2048. A larger image is scaled down to this long side and is never enlarged, so the long side of the result is the smaller of the long side of the input and `size`.' }
    RemoveBackgroundResponse:
      allOf:
        - $ref: '#/components/schemas/CallMeta'
        - type: object
          required: [format, width, height, data]
          properties:
            format: { type: string, enum: [png, webp], description: 'Echoes `options.format`.' }
            width: { type: integer, description: Width of the returned image in pixels. }
            height: { type: integer, description: Height of the returned image in pixels. }
            data: { type: string, description: 'Base64 PNG or WebP, as `format` says; a byte string in CBOR responses.' }
    Model:
      type: object
      description: A model with its prices and its availability for the calling account.
      required: [id, task, name, endpoints, prices, available]
      properties:
        id: { type: string, description: 'Model id, as used in the `model` request field.' }
        name: { type: string, description: Display name. }
        task: { type: string, enum: [segment, ocr, parse, embed, remove-background], description: Kind of work the model does. }
        endpoints: { type: array, items: { type: string }, description: Endpoints that accept the model. }
        license: { type: string, description: License of the model weights. }
        prices:
          type: array
          description: Price book of the model.
          items:
            type: object
            required: [unit, price]
            properties:
              unit: { type: string, description: 'Priced unit: `encode_image`, `prompt`, `point`, `box`, `refine`, `image`, `page` or `text`.' }
              price:
                $ref: '#/components/schemas/Credits'
                description: Credits per unit.
        available: { type: boolean, description: Whether the calling account may use the model now. }
        pool: { type: [string, 'null'], description: 'Pool serving the account (public, free, paid); null for internal accounts or when unavailable.' }
        freeDailyCalls: { type: [integer, 'null'], description: 'Included calls per UTC day at no charge (null: none).' }
        perMinute: { type: [integer, 'null'], description: "Calls per minute at which the included daily allowance is served (null: none). Beyond it, the public pool answers 429; with a free pool, calls are billed from the balance instead." }
        unlockedBy: { type: [string, 'null'], description: 'When not available: what unlocks it, e.g. "top-up".' }
    BatchRequest:
      type: object
      description: |
        A batch of single calls to one endpoint. `model` is set once (omit it where the endpoint has a default
        model); an item must not contain `model`. Every item is validated before anything runs: a structural error
        is `400 invalid_request` whose message names `items[i]`, and nothing is billed. Images in items can only be
        `{"id": "img_..."}` handles. Items run strictly one after another, so the order of the array is the order of
        execution. At most 1,000 items and 4 MiB per request. `Idempotency-Key` makes item `i` use the derived key
        `"b <key> <i>"`: repeating the same batch replays finished items (`replayed: true`, no charge), runs the others,
        and an item whose content changed fails with `idempotency_conflict`.

        Limits: event-stream mode runs for at most 600 s, JSON mode for at most 90 s (JSON mode is **not
        recommended** beyond a few items). `timeoutSec` can only shorten them; a larger value is clamped without an
        error. When the limit passes, no new item starts, the running item is cancelled (not billed) and every item
        not finished is `expired`; the results of finished items are kept. A client disconnect stops the batch the same
        way. At most 1 to 4 batch requests can be open per account at once, depending on the tier (`429 too_many_batches`).
      required: [items]
      properties:
        model: { type: string, description: 'Model id for all items. Optional where the endpoint has a default model.' }
        items:
          type: array
          description: 'Single-call request bodies of the endpoint, without `model`, in execution order.'
          minItems: 1
          maxItems: 1000
          items: { type: object, description: 'The request body of the single-call endpoint without `model`; images only as `{"id": "img_..."}`.' }
        timeoutSec: { type: number, exclusiveMinimum: 0, description: 'Time limit for the whole batch in seconds, counted from the arrival of the request. Can only shorten the mode limit (600 s event stream, 90 s JSON).' }
    SegmentBatchRequest:
      description: '`POST /v1/batch/segment`: a `BatchRequest` whose items are `SegmentItem` bodies.'
      allOf:
        - $ref: '#/components/schemas/BatchRequest'
        - type: object
          properties:
            model: { type: string, enum: [sam3, sam-lite], description: 'Model for all items: `sam3` or `sam-lite`.' }
            items:
              type: array
              minItems: 1
              maxItems: 1000
              description: Segmentation items in execution order.
              items: { $ref: '#/components/schemas/SegmentItem' }
    BatchItem:
      type: object
      description: The outcome of one item; the `data` of an `item` event and an element of `BatchResponse.items`.
      required: [index, status]
      properties:
        index: { type: integer, minimum: 0, description: Position of the item in the request. }
        status: { type: string, enum: [ok, error, expired], description: '`ok`: the call succeeded and was billed. `error`: it failed and was not billed. `expired`: the batch time limit passed before the item finished; not billed.' }
        result: { type: object, description: 'On `ok`: exactly the success response of the single call, including `id`, `cost`, `balance`, `billing` and `timing`.' }
        error:
          type: object
          description: 'On `error`: the error of the single call (an insufficient balance fails only this item; the next items are still tried).'
          required: [code, message]
          properties:
            code: { type: string, description: Stable error code, as listed under Responses. }
            message: { type: string, description: Human-readable explanation. }
        replayed: { type: boolean, description: 'True when the item was answered from an earlier batch under the same `Idempotency-Key`; nothing ran or was charged.' }
    BatchProgress:
      type: object
      description: 'The `data` of a `progress` event. Sent immediately when the stream starts and again whenever 15 seconds pass without any event.'
      required: [done, remaining]
      properties:
        done: { type: integer, minimum: 0, description: Items finished so far (any status). }
        remaining: { type: integer, minimum: 0, description: Items not finished yet. }
        etaWaitMs: { type: integer, minimum: 0, description: 'Expected queueing wait of the current item in milliseconds. Omitted when no estimate exists. The position in the queue is never reported.' }
    BatchSummary:
      type: object
      description: 'The final `summary` event, and `summary` of the JSON response.'
      required: [counts, cost, balance, elapsedMs]
      properties:
        counts:
          type: object
          description: Number of items per status.
          required: [ok, error, expired]
          properties:
            ok: { type: integer, minimum: 0, description: Items with status `ok`. }
            error: { type: integer, minimum: 0, description: Items with status `error`. }
            expired: { type: integer, minimum: 0, description: Items with status `expired`. }
        cost:
          $ref: '#/components/schemas/Credits'
          description: Credits charged by this request (replayed items are not charged again).
        balance:
          $ref: '#/components/schemas/Credits'
          description: Account balance when the batch ended.
        elapsedMs: { type: integer, minimum: 0, description: Time from the arrival of the request to the end of the batch in milliseconds. }
    BatchResponse:
      type: object
      description: The JSON-mode response (not recommended; see `BatchRequest`).
      required: [items, summary]
      properties:
        items:
          type: array
          description: One entry per item, sorted by `index`.
          items: { $ref: '#/components/schemas/BatchItem' }
        summary: { $ref: '#/components/schemas/BatchSummary' }
