openapi: 3.1.0
info:
  title: Foldbun Stack public API
  version: 1.5.0
  description: |
    Pay-per-use computer-vision model API (segmentation, OCR, document parsing, embeddings,
    background removal). v1: synchronous calls, batches and asynchronous jobs (`/v1/jobs`); webhooks come later.

    **Request id.** Every response (errors included) carries `X-Request-Id`, a random 16-hex-character id
    generated by the server (a header sent by the client is ignored). Keep it with a failed call: it identifies the request.

    **Auth and request kinds.** Every `/v1` request is one of three kinds, decided by the credentials it carries:

    | `Authorization` | `X-Foldbun-Project` | Kind |
    |---|---|---|
    | `Bearer fbs_...` (API key) | none | **Paid.** Billed to the key's account at list prices. |
    | none | `fbp_...` (project ID) | **Free tier.** Nothing is charged; the free limits below apply. |
    | `Bearer fbs_...` | `fbp_...` | **Paid**, exactly as with the key alone. The project is recorded as the *source project* of the call (see below). |

    An API key is created in the console. A key may carry `model:<id>` scopes; when it has any, it can only call those
    models. A project ID is `fbp_` followed by 22 base62 characters and a 6-character checksum (32 characters); the
    console shows it. **A project ID is not a secret**: it is meant to sit in web pages and public repositories, and it
    can only start free-tier calls. **Never put an API key in `X-Foldbun-Project`**: such a request is answered
    `400 key_in_project_header` before anything else, and the value is never logged. The header is read as sent (case matters,
    surrounding whitespace is removed); there is no query-parameter form.

    A request that sends `Authorization` is judged on its key alone: a missing, malformed, expired, revoked or unknown
    key is `401 unauthorized` and **never falls back to the free tier**, whatever `X-Foldbun-Project` says; a key without
    enough balance, or with a negative paid balance, is `402 insufficient_balance`. Sending a project ID in `Authorization` is `401 unauthorized` with a
    hint. A request with neither credential is `401 unauthorized`. A project ID that is malformed, unknown, archived or
    past its rotation grace period is `401 invalid_project`.

    **Source project.** With a key and a project ID together, the project is recorded with the call as its *source
    project*: self-reported, not verified, used for statistics only. It changes nothing about the call (price,
    limits, scheduling); the response only echoes it: `billing.sourceProject` on calls and `sourceProject` on
    `GET /v1/whoami`. A value that is not a project ID at all is `400 invalid_request`; a well-formed ID
    that is unknown or archived is ignored (`billing.sourceProject: null`).

    **Free tier.** A project ID alone runs a call on the free tier, for trying Stack and for apps whose users try it
    before they pay. Free calls cost nothing and are metered per project. They run only on spare GPU time, behind
    every paid call (`429 free_busy` when the free queue is too long). What a free call may do:

    - **Endpoints.** The single-call endpoints (`POST /v1/segment`, `/v1/refine`, `/v1/ocr`, `/v1/documents/parse`,
      `/v1/embeddings`, `/v1/remove-background`) and `GET /v1/whoami`, for the models the free tier offers (any other model is
      `403 free_tier_unsupported`), and `GET /v1/models`. Not offered: `POST /v1/images` and `POST /v1/batch/{endpoint}`
      (`403 free_tier_unsupported`).
    - **Request.** The image must be inline `{"base64": "..."}`: an image handle `{"id": "img_..."}` is
      `403 free_tier_unsupported` (handles belong to an account). The decoded image may be at most 4 MiB by default
      (`413 payload_too_large`). `Idempotency-Key` is not supported (`403 free_tier_unsupported`). The number of prompts and texts per call is
      smaller than for paid calls (by default 10 prompts, 5 `sam3` text prompts, 16 `siglip2` texts; more is
      `400 invalid_request`, and the message names the limit). These numbers are defaults and can change.
    - **Response.** The usual call fields with `cost: 0`, **no `balance`**, `billing.tier: "free"`, `billing.project`
      (the project ID), `billing.listPrice` (what the call would have cost at list prices, the value given away),
      `billing.charged: false` and `billing.pool: null`; SAM results carry `imageFee: 0`; `timing.freeQueueMs` is the
      time the call waited for its free slot. The free response never shows anything about the project's owner.
    - **Limits.** Per project and per weight class of the model (light, medium, heavy): a steady rate with a small
      burst; per client IP inside a project (a project can switch this off for calls from its own servers); per account, over
      its standard projects together; and a number of calls per UTC day. The limits depend on the project's
      tier. Free responses carry `X-RateLimit-Limit`, `-Remaining`, `-Reset` and `-Scope` for the tightest limit that applied. A refusal is `429 rate_limited`
      (the message says which limit) or `429 daily_limit_reached` (until 00:00 UTC), with `Retry-After` and `retryAfterMs`.
      `GET /v1/whoami` with a project ID alone returns the project's limits and today's use without spending any of them. Read
      the numbers there rather than hard-coding them.
    - **Network.** A project can be limited to calls from given server networks or browser origins; other calls are
      `403 forbidden`.
    - **Availability.** The free tier is not available in every region, and can be switched off: both answer
      `403 free_tier_unavailable`.

    **Browser access (CORS).** On the API host every response under `/v1/` carries `Access-Control-Allow-Origin: *`, error
    responses included, and a preflight `OPTIONS /v1/...` is answered `204` without authentication or limits
    (`Access-Control-Allow-Methods: GET, POST, DELETE`; `Access-Control-Allow-Headers: Authorization, Content-Type, Accept, X-Foldbun-Project, Idempotency-Key`;
    `Access-Control-Max-Age` 600 seconds by default). `Access-Control-Allow-Credentials` is never sent (the
    API has no cookies), so a page can only use credentials it holds. `Access-Control-Expose-Headers` lists `Retry-After`,
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`, `X-RateLimit-Scope`, `X-Request-Id`,
    `Idempotent-Replayed` and `X-Foldbun-Version`. A page may carry its project ID; never put an API key in a
    page: if the page needs a key, let the user enter one.

    **Money.** Amounts are credits, written as JSON numbers with up to 6 decimals (the unit is a
    micro-credit, so they are exact). Top-ups are credited at US$1 = 1,000 credits. `cost` is what
    this call charged, `balance` is the account balance after it (a free-tier call costs 0 and has no `balance`). Failed calls cost 0.

    **Images.** Every image input is `{"id": "img_<sha256>"}`, `{"base64": "..."}` or
    `{"url": "https://..."}` (`url` is reserved: **later**, today it answers 400 `unsupported`).
    Uploaded images are sanitized by Stack, and an inline `image.base64` behaves like an upload: metadata
    (EXIF, XMP, comments, thumbnails) and any data appended after the image are removed at upload; the pixels
    are not changed or re-encoded. The sanitized image is stored on Stack's servers in Hong Kong for at most 7 days
    (below). Inference runs on GPU nodes located in mainland China; the uploaded image itself is never sent to them:
    a node receives only the per-model resized copy generated by Stack and the text of the call, and returns the
    result. See also the privacy policy (https://foldbun.com/privacy/). **All coordinates in requests and
    responses are pixels of the oriented original**: the uploaded image with its EXIF orientation applied, at its
    full size. Its size is returned as `image.width` / `image.height` (and by `POST /v1/images`); there is no
    resizing and no short-side limit beyond the input limits below. Boxes and polygons are always in image pixels; a
    mask can be smaller than the image: it carries its own size in `mask.size`, and clients scale by it (see
    `options.maskSize`).
    `img_<sha256>` is the SHA-256 of the sanitized bytes (not of the uploaded file). A handle is valid only inside the account
    that uploaded it, and is kept on a best-effort basis and **deleted after at most 7 days**, counted from
    when the account first stored it (earlier under capacity pressure, least recently used first; no minimum
    retention; `DELETE /v1/images/{id}` deletes one at once): on `404 image_not_found`, upload again. If the image storage is temporarily unavailable, a call
    answers `503 unavailable` with `Retry-After`. A file that passes the upload checks but cannot be decoded
    is `400 invalid_image` on its first use; the handle then keeps answering `invalid_image`, and the call is never charged.
    Accepted: JPEG, PNG, static WebP; at most 20 MiB and 40 megapixels (16384 px per side) per
    upload, and a JPEG has at most 64 scans (progressive files from common encoders use about 10;
    more is `400 invalid_request`); a JSON request body is at most 28 MiB so a base64 image fits.

    **Caching and the SAM encoding fee.** SAM-family models (`sam3`, `sam-lite`) charge an image
    encoding fee (`encode_image`) per call. When the encoding of the same image was already computed
    for the calling account and is still cached on the GPU node, the fee is waived and the response says
    `"cache": "hit"` with `"imageFee": 0`. This is a bonus, **not a promise**: cached encodings are
    **deleted after at most 7 days** and evicted earlier under capacity pressure, with no minimum retention. Caches are per account and never shared across accounts.

    **Segmentation results.** Instances carry a simplified polygon with holes by default and no mask; masks (COCO
    compressed RLE or lossless WebP crops) are returned on request. Post-processing (score and size filters, cleanup,
    overlap removal, merging) is free and configured per prompt; see `SegmentRequest` and `SegmentOptions`.

    **CBOR responses.** `POST /v1/segment`, `POST /v1/refine`, `POST /v1/remove-background` and the JSON mode of
    `POST /v1/batch/{endpoint}` answer in CBOR (RFC 8949, `Content-Type: application/cbor`) when `Accept` lists
    `application/cbor`; any other `Accept` gives JSON. The structure and the keys are those of the JSON response.
    Polygon rings (`outer` and each entry of `holes`) are RFC 8746 typed arrays, tag 69 (uint16, little-endian, x and y
    interleaved, absolute image pixels); binary payloads (`data` of WebP masks and of background removal) are byte
    strings instead of base64; integers are CBOR integers and other numbers are floating point. Requests, errors and
    event streams are always JSON. A replayed response (`Idempotency-Key`) follows the `Accept` of the repeated request.

    **Errors.** `{"error": {"code", "message", "retryable", "retryAfterMs"}}`. `429` and `503` carry a
    `Retry-After` header (seconds). Codes are listed on the `Error` schema.

    **Idempotency.** Send `Idempotency-Key: <1..128 printable ASCII>` on any POST that spends credits (not supported on the free tier).
    Within an account, a key is remembered for 24 hours. Repeating a request with the same body returns the
    original response (status and body, plus header `Idempotent-Replayed: true`) and does not charge or run
    again. "Same body" means the same JSON content: key order and whitespace do not matter, array order and values
    do, and numbers are compared as written (`1` and `1.0` differ). The same key with a different body is
    `409 idempotency_conflict`; the same key while the first request is
    still running is `409 request_in_progress`. Only final outcomes are stored (2xx and permanent 4xx); a 402, 429 or 5xx
    frees the key so the same request can be retried under it. A malformed body (`400 invalid_request` from the
    structural check) and a model the calling API key may not use (`403 model_locked`) are answered before the
    Idempotency-Key is looked up: they are never stored and never replayed, so a key never receives a stored
    response for a model it is not allowed to call.

    **Disconnects.** A call is billed once its result has been produced, also when the client disconnected or gave
    up in the meantime: the GPU work was done. A call cancelled while it is still queued, before a GPU node took
    it, is not run and not billed. To get the result of a call whose connection broke, repeat it with the same
    `Idempotency-Key`: the stored result is returned without a second charge. Send a key on every call that may
    be retried.

    **Billing and limits of paid calls.** A paid call is billed from the account balance at the list prices
    (`GET /v1/models`); there are no included daily calls: the daily allowances of the former public and free pools are
    retired, and the free tier is reached with a project ID instead. An account without balance, or whose paid
    balance is negative (after a refund or chargeback), gets `402 insufficient_balance`. `403 model_locked` is answered only for a model that is not open in the catalogue, or
    outside the key's `model:` scopes; lack of credit is never `429` or `model_locked`. There is no per-minute call
    limit on keyed calls: they are bounded by the account's concurrency limit, the scheduler's admission
    (`429 rate_limited`, `503 model_busy`) and the upload limits. Every keyed response says what the call was billed as and to
    which project: `billing.tier` is `paid` (the value `allowance`, for a call covered by a legacy daily allowance, no
    longer occurs now that the allowances are retired), `billing.project` is the project ID of the calling key (on the
    Playground account lane, which has no key, the account's default project), and `billing.sourceProject` is the
    source project the request named, or `null`. The fields that described pools and allowances are retired and kept only so
    existing clients keep parsing: `billing.pool` is `"paid"` on every billed keyed call (null for internal accounts and for
    free-tier calls), `billing.allowance` is never sent, `dailyAllowances` of `GET /v1/whoami` is always empty, and in
    `GET /v1/models` `pool` is `"paid"` and `freeDailyCalls`, `perMinute` are null. Do not rely on them.

    **Batch.** `POST /v1/batch/{endpoint}` runs up to 1,000 single-call bodies (`items`) of one endpoint
    (`segment`, `ocr`, `documents/parse`, `embeddings`, `remove-background`) under one model, one after another,
    in one request. Items are scheduled in the batch class (below interactive and sync traffic, fair between
    accounts). Each item is priced, billed and settled exactly like a single call, as soon as it finishes; the
    no per-minute call limit applies to the request or to its items. Images in items must be `{"id": "img_..."}`
    handles (upload first). **Server-Sent Events (`Accept: text/event-stream`) is the recommended mode**: results
    arrive item by item and progress heartbeats keep the connection alive (up to 600 s). Plain JSON mode waits for
    all items and is limited to 90 s; it is **not recommended** beyond a few items. `timeoutSec` can only shorten
    the limit. Items not finished at the limit are returned as `expired` and are not billed. When the client
    disconnects, no further item starts; the item a GPU node is already running finishes and is billed if it
    succeeds. With `Idempotency-Key`, a repeated batch replays the finished items, including that one. Not available on the Playground trial lane.

    **More.** Guides: [Quickstart](/docs/quickstart/), [Errors](/docs/errors/), [Rate limits and pools](/docs/rate-limits/),
    [Billing](/docs/billing/). The machine-readable contract is [openapi.yaml](/docs/openapi.yaml).
servers:
  - url: https://api.stack.foldbun.com
    description: Production.
security:
  - bearer: []
  - bearer: []
    project: []
tags:
  - name: Images
    description: Upload an image once and reuse its handle in later calls. Free of charge.
  - name: Segmentation
    description: Instance masks from text, box and point prompts, and interactive refinement of a single mask. Models `sam3` and `sam-lite`.
  - name: OCR
    description: Text recognition for screenshots and crops (`ppocr-v6`), and layout analysis of document pages (`paddleocr-vl`).
  - name: Embeddings
    description: Image and text vectors for similarity search. Models `dinov3` and `siglip2`.
  - name: Background removal
    description: Cut-out of the main subject, or its alpha matte, from one image. Model `birefnet`.
  - name: Catalog
    description: Models, prices and what the calling account may use. Free and not metered.
  - name: Batch
    description: Many calls of one endpoint in one request, delivered as an event stream (recommended) or one JSON document. Billed per item at the single-call prices.
  - name: Async jobs
    description: Many embedding calls queued as one background job at the lowest priority and the asynchronous prices; poll it, read the results later, cancel what has not started.
paths:
  /v1/images:
    post:
      tags: [Images]
      operationId: uploadImage
      summary: Upload an image, get a handle
      description: |
        Send the file either as `multipart/form-data` (field `file`) or as the raw request body with
        `Content-Type: image/jpeg | image/png | image/webp`. The image is sanitized (see the Overview); the handle is
        content-addressed, so uploading the same picture again returns the same `id` (HTTP 200 instead of 201).
        Free of charge. Not usable to probe other accounts' images: handles only resolve inside the owning account.
        Accepted formats and size limits are listed in the Overview.

        Keyed calls have no per-minute call limit, but uploads have limits of their own, per account and over
        all keys: 600 per minute (burst 120), at most 16 in flight (together at most a quarter of the server's request
        body memory), and a cap on images not yet copied to long-term storage. Over any of them the answer is
        `429 rate_limited` with `Retry-After`; nothing is charged. The values are defaults and can change.
      requestBody:
        required: true
        description: The image file, as a multipart form or as the raw request body.
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary, description: 'The image file: JPEG, PNG or static WebP.' } }
          image/jpeg: { schema: { type: string, format: binary, description: Raw JPEG bytes. } }
          image/png: { schema: { type: string, format: binary, description: Raw PNG bytes. } }
          image/webp: { schema: { type: string, format: binary, description: Raw static WebP bytes. } }
      responses:
        '200':
          description: "The same image was stored before; its existing handle is returned."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageInfo' }
              example:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
                width: 1008
                height: 672
                bytes: 184233
                contentType: image/jpeg
        '201': { description: The image was sanitized and stored; the new handle is returned., content: { application/json: { schema: { $ref: '#/components/schemas/ImageInfo' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/images/{id}:
    delete:
      tags: [Images]
      operationId: deleteImage
      summary: Delete an image
      description: |
        Deletes one of the account's images at once: the handle stops working and the stored file is removed (unless
        another account uploaded the very same bytes, in which case only this account's handle goes). Without a call to
        this endpoint an image is deleted automatically after at most 7 days. Calls that were already accepted are not
        affected; a later call that names the handle answers `404 image_not_found`. Free of charge, API key only.

        An unknown handle, a malformed one and another account's handle all answer `404 image_not_found`, so the answer
        reveals nothing about other accounts' images. Deleting twice answers `404 image_not_found` the second time. A free-tier
        call (project ID without a key) is `403 free_tier_unsupported`.
      parameters:
        - name: id
          in: path
          required: true
          description: 'The image handle, `img_` plus 64 hex characters, as returned by `POST /v1/images`.'
          schema: { type: string, pattern: '^img_[0-9a-f]{64}$' }
      responses:
        '204': { description: The image was deleted. No body. }
        default: { $ref: '#/components/responses/Error' }
  /v1/segment:
    post:
      tags: [Segmentation]
      operationId: segment
      security: [ { bearer: [] }, { project: [] }, { bearer: [], project: [] } ]
      summary: Segment objects from prompts
      description: |
        `sam3` takes text prompts, exemplar boxes ("find more like this") and point prompts, alone or mixed in one request.
        Billing counts decodes: each text prompt is billed once (`prompt`); exemplar boxes add no charge (they are attached
        to every text prompt), and a request with exemplar boxes but no text prompt is billed as one prompt. Point prompts
        are billed per `point`, and the image encoding once (`encode_image`, waived on a cache hit). A point prompt selects exactly one object (the best mask for that
        single positive point) and always yields one instance. Exemplar boxes apply to the text prompts, never to
        points. A request with point prompts only is valid. `sam-lite` takes only boxes and points; each
        prompt gives one instance and is billed per `box` or `point`, plus its own `encode_image`. Prices: `GET /v1/models`.
        Post-processing is free and configured per prompt (`options.defaults`, `prompts[].options`): prompt kinds and
        merging on `SegmentRequest`, processing order and limits on `SegmentOptions`. By default each instance carries a
        simplified polygon with holes and no mask.
        The call reserves the full price (encode fee + prompts) before it runs and settles on what the
        worker reports.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CborAccept' }
      requestBody:
        required: true
        description: Model, image and prompts of the segmentation.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SegmentRequest' }
            example:
              model: sam3
              image:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
              prompts:
                - text: dog
              options:
                defaults:
                  filter:
                    minScore: 0.5
      responses:
        '200':
          description: "The instances found, with the cost and balance of the call. CBOR with `Accept: application/cbor`."
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
            X-RateLimit-Scope: { $ref: '#/components/headers/RateLimitScope' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SegmentResponse' }
              example:
                id: call_0b6c2f0e-6f0e-4d0e-9f3a-5c1d2e3f4a5b
                model: sam3
                image:
                  id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
                  width: 1008
                  height: 672
                  bytes: 184233
                  contentType: image/jpeg
                cost: 0.05
                balance: 96.25
                timing:
                  queueMs: 4
                  processingMs: 212
                  inferenceMs: 187
                  imageFetchMs: 0
                  serverMs: 231
                billing:
                  lines:
                    - unit: encode_image
                      quantity: 1
                      unitPrice: 0.5
                      amount: 0
                      waived: true
                    - unit: prompt
                      quantity: 1
                      unitPrice: 0.05
                      amount: 0.05
                      waived: false
                  total: 0.05
                  charged: true
                  pool: null
                instances:
                  - prompt: 0
                    label: dog
                    score: 0.97
                    bbox: [312, 148, 702, 611]
                    area: 121530
                    polygon:
                      - outer: [402, 148, 655, 170, 701, 402, 610, 610, 330, 590, 312, 300]
                dropStats:
                  - { prompt: 0, lowScore: 0, tooSmall: 0, tooSmallArea: 0, overlap: 1, limit: 0, budget: 0 }
                cache: hit
                imageFee: 0
            application/cbor:
              schema: { $ref: '#/components/schemas/SegmentResponse' }
        default: { $ref: '#/components/responses/Error' }
  /v1/refine:
    post:
      tags: [Segmentation]
      operationId: refine
      security: [ { bearer: [] }, { project: [] }, { bearer: [], project: [] } ]
      summary: Refine one mask from clicks and/or a box
      description: |
        Interactive refinement of a single object: positive and negative `points`, optionally a `box`. Limits: at most 20
        points. Billed per call as one decode (`refine`, 1 per call), however many points and whether or not a box is
        given, plus the image encoding (`encode_image`, waived on a cache hit; refining an image that was just
        segmented is normally a hit). A client that re-sends all points after every click therefore pays the same for each click.
        Interactive priority: if the call has not finished within 2 s of submission, it fails with HTTP 504 and error code `upstream_timeout` (retryable).
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CborAccept' }
      requestBody:
        required: true
        description: Image, clicks and/or box to refine one mask.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefineRequest' }
            example:
              model: sam3
              image:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
              points:
                - x: 412
                  y: 230
                  positive: true
                - x: 80
                  y: 40
                  positive: false
      responses:
        '200':
          description: 'The refined object (up to 3 candidates with `options.multimask`), in the same shape as a segmentation result without `dropStats`. CBOR with `Accept: application/cbor`.'
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
            X-RateLimit-Scope: { $ref: '#/components/headers/RateLimitScope' }
          content:
            application/json: { schema: { $ref: '#/components/schemas/SegmentResponse' } }
            application/cbor: { schema: { $ref: '#/components/schemas/SegmentResponse' } }
        default: { $ref: '#/components/responses/Error' }
  /v1/ocr:
    post:
      tags: [OCR]
      operationId: ocr
      security: [ { bearer: [] }, { project: [] }, { bearer: [], project: [] } ]
      summary: Text recognition for screenshots and cropped regions
      description: Model `ppocr-v6` (default). Billed per image.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        description: Image to read.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OcrRequest' }
            example:
              image:
                id: img_3b1f0c5e9a7d42c8b6e1f0a9d8c7b6a5f4e3d2c1b0a998877665544332211000
              options:
                minConfidence: 0.5
                words: false
      responses:
        '200':
          description: "The recognised text lines."
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
