[project]
name = "stack-cookbook-harness"
version = "0.2.0"
description = "Test harness of the Foldbun Stack Cookbook: contract checks, fake API, offline and live matrix."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "numpy>=2.1",
    "pillow>=11.0",
    "prometheus-client>=0.21",  # tests of use case 08
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["site", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]
